<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="40%" stop-color="#F5C542" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="leatherGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D3748" />
      <stop offset="50%" stop-color="#1A202C" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="tapMetalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#F5C542" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background circle for perfect tab contrast -->
  <circle cx="32" cy="32" r="30" fill="#0B0F19" stroke="url(#goldGrad)" stroke-width="2" />

  <!-- Tap Dance Oxford Shoe Silhouette -->
  <g transform="translate(4, 6) scale(0.88)">
    <!-- Heel Block -->
    <path d="M 12 40 L 19 40 L 18 48 L 13 48 Z" fill="url(#leatherGrad)" stroke="#4A5568" stroke-width="0.75" />
    <!-- Heel Metal Tap Plate (Chapinha do Salto) -->
    <path d="M 12.5 48 L 18.5 48 C 18.5 50.5 13 50.5 12.5 48 Z" fill="url(#tapMetalGrad)" stroke="#CBD5E1" stroke-width="0.75" />

    <!-- Sole (Sola) -->
    <path d="M 18 40 Q 30 40 40 42 L 53 43 C 57 43 59 40 54 38 L 18 38 Z" fill="#475569" />

    <!-- Toe Metal Tap Plate (Chapinha da Frente / Bico) -->
    <path d="M 40 42 Q 47 43 54 41 C 55.5 42.5 52 44.5 40 43.5 Z" fill="url(#tapMetalGrad)" stroke="#CBD5E1" stroke-width="0.75" />

    <!-- Shoe Upper Body (Corpo do Sapato de Sapateado) -->
    <path d="M 12 40 C 10 32 12 24 18 20 C 23 23 27 28 32 30 C 40 31 51 34 56 37 C 58 38.5 56 41 52 41 C 42 41 32 39 19 39 L 12 40 Z" fill="url(#leatherGrad)" stroke="#64748B" stroke-width="0.75" />

    <!-- Wingtip Toe Cap (Recorte Clássico Brogue / Wingtip) -->
    <path d="M 42 32 C 45 35 48 35 55 37 C 54 40 50 41 44 40 C 40 37 39 34 42 32 Z" fill="#334155" stroke="url(#goldGrad)" stroke-width="0.75" opacity="0.9" />

    <!-- Ankle Collar & Tongue (Cano e Língua) -->
    <path d="M 18 20 C 21 19 25 21 27 24 C 23 26 20 23 18 20 Z" fill="#1E293B" stroke="url(#goldGrad)" stroke-width="0.75" />

    <!-- Classic Oxford Laces (Cadarços do Sapato) -->
    <line x1="24" y1="24" x2="28" y2="26" stroke="url(#goldGrad)" stroke-width="1.2" stroke-linecap="round" />
    <line x1="26" y1="26" x2="30" y2="28" stroke="url(#goldGrad)" stroke-width="1.2" stroke-linecap="round" />
    <line x1="28" y1="28" x2="32" y2="30" stroke="url(#goldGrad)" stroke-width="1.2" stroke-linecap="round" />

    <!-- Sound / Rhythm Sparkles around Taps -->
    <!-- Toe Sparkle -->
    <polygon points="56,33 57.5,30 59,33 62,34.5 59,36 57.5,39 56,36 53,34.5" fill="url(#goldGrad)" filter="url(#glow)" />
    <!-- Small Tap Spark -->
    <circle cx="51" cy="46" r="1" fill="#FFF3C4" />
    <circle cx="15" cy="53" r="1" fill="#FFF3C4" />
  </g>
</svg>
